name: Bug report
description: Something does not work as it should in Cleitext, an official plugin or the admin.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. You may write in English or Italian.
        **Security problems:** do not open an issue, follow [SECURITY.md](https://github.com/faghy/cleitext/blob/main/SECURITY.md).
        Problems with a theme (Canvas, Pulsar, Vitality…) go to [cleitext-catalog](https://github.com/faghy/cleitext-catalog/issues/new/choose).
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Core (admin, editor, public pages, updates)
        - Fresco (page builder)
        - An official plugin
        - Installation or hosting
        - Other
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: When it is about a plugin, its name and version (Plugins page).
      placeholder: e.g. SEO 1.3.0
  - type: input
    id: version
    attributes:
      label: Cleitext version
      description: Dashboard → Updates, or the admin footer.
      placeholder: e.g. 0.37.0
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site address
      description: Optional, when the problem can be seen there.
      placeholder: https://example.com/page
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 141 on Windows
