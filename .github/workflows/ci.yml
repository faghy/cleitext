name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # RNF-08: no open high or critical vulnerabilities; RNF-17: GPL-compatible licenses.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm check:licenses
      - run: pnpm build
      - run: pnpm typecheck
      # RNF-04: initial admin load under 500 KB gzip, Gutenberg lazy.
      - run: pnpm check:bundle
      # Tests start an embedded PostgreSQL (no containers needed).
      - run: pnpm test
      # End-to-end: the real admin and Gutenberg editor in Chromium, axe included (RNF-09).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # RNF-10: the same suite in Firefox and in Safari's engine.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The system packages of Firefox and WebKit come from Ubuntu's mirror, which can
      # take half an hour: the downloaded .deb files are kept between runs.
      - uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: apt-debs-${{ runner.os }}-
      - run: |
          mkdir -p ~/apt-debs
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - run: pnpm e2e:browsers
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-browsers
          path: playwright-report/
          retention-days: 7

  # RNF-13 coverage of the core; RNF-01/02/05/14 and RF-THM-05 budgets.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:perf
      - run: pnpm check:scale
