<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cleitext</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E %3Crect width='64' height='64' rx='15' fill='#0369a1'/%3E %3Cpath d='M38.5 22.5 A13.5 13.5 0 1 0 38.5 41.5' fill='none' stroke='#fff' stroke-width='7' stroke-linecap='round'/%3E %3Crect x='43' y='19' width='5' height='26' rx='2.5' fill='#7dd3fc'/%3E %3C/svg%3E"
    />
    <script>
      // The color scheme chosen in the profile, applied before the first paint.
      try {
        const theme = localStorage.getItem('cleitext.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
