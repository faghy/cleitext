packages:
  - apps/*
  - packages/*
  - themes/*
  - tools/*
  - plugins/*

# Dependencies allowed to run install scripts.
allowBuilds:
  '@swc/core': true
  esbuild: true
  # PostgreSQL binaries for local development and tests (restores library symlinks).
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true

# A single Fastify version for NestJS and the @fastify plugins.
overrides:
  fastify: ^5.12.5

# Audit: advisories that cannot reach Cleitext, each with its reason.
auditConfig:
  ignoreGhsas:
    # TinyMCE media plugin (data-mce-object): Classic Editor bundles only lists, link,
    # charmap, fullscreen and help (plugins/classic-editor/src/tinymce.ts). The fixed
    # 7.9.4 is not on npm, and TinyMCE 8 is not under GPL alone, so 7.9.3 stays.
    - GHSA-mf2p-h6hf-fcwm
